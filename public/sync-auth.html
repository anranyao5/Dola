<section id="cloudAuth" aria-labelledby="cloudTitle"><form id="cloudLogin"><h1 id="cloudTitle">Dva 云朵小家 ☁</h1><p>家长和孩子登录同一个家庭，就能共享作业和成长记录。</p><label>操作<select name="mode"><option value="login">登录已有家庭</option><option value="create">家长创建家庭</option></select></label><label data-login>家庭编号<input name="code" placeholder="DVA-XXXXXXXXXX" autocapitalize="characters" autocomplete="off"></label><label data-login>身份<select name="role"><option value="parent">家长</option><option value="child">孩子</option></select></label><label>密码<input name="password" type="password" autocomplete="current-password" required placeholder="家长至少8位；孩子为6位数字"></label><label data-create hidden>给孩子设置6位数字密码<input name="childPassword" type="password" inputmode="numeric" autocomplete="new-password" maxlength="6"></label><button class="primary" type="submit">进入小家</button><p id="cloudAuthMessage" role="status"></p></form></section>
<aside id="cloudBar" hidden><strong id="cloudIdentity"></strong><span id="cloudStatus" role="status">正在连接…</span><button id="cloudRefresh">刷新同步</button><button id="cloudExport">备份记录</button><label id="cloudImportLabel" hidden>导入旧版备份<input id="cloudImport" type="file" accept="application/json,.json" hidden></label><button id="completionSoundToggle" type="button" aria-pressed="true">音效：开</button><button id="cloudLogout">退出账号</button></aside>
